interface:
  display_name: "歌词驱动代码 MV"
  short_description: "将歌词意象写成角色任务与音乐时间线，制作可复用的像素游戏代码音乐视频"
  default_prompt: "使用 $lyric-driven-code-mv，根据我提供的歌曲制作 MV。人物或剧情未指定时先查证背景，只补缺失设定；主要角色先过无色剪影与小尺寸群像辨识门槛，再做代表片段；逐句把歌词编译成可识别物件、景别、动作和可见结果；先审关键帧与无字幕版，按 visual/beat/free 选择音效锚点，分开记录波形起点 at 与目标落点 hitAt，并说明核验能力边界；已有成片先评审定位并定向复评，保留已确认的转场并按要求范围交付。"
